[package]
name = "impin"
version = "0.2.0"
edition = "2024"
rust-version = "1.93" # zenavif (pure-Rust AVIF) requires 1.93; CI/toolchains are latest-stable anyway
description = "Wayland layer-shell overlay pinning reference images: zoom, pan, opacity, rounded corners"
license = "MIT"
repository = "https://github.com/mdrv/impin"

[dependencies]
gpui = { package = "mdrv-gpui-ce", git = "https://github.com/mdrv/gpui-ce", tag = "mdrv-gpui-0.0.260925.10" }
gpui_platform = { package = "mdrv-gpui-platform", git = "https://github.com/mdrv/gpui-ce", tag = "mdrv-gpui-0.0.260925.10" }
anyhow = "1"
blake3 = "1" # content-address clipboard image store (spec)
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
futures = "0.3"
image = "0.25" # read image dimensions for default pin size
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1" # parse `hyprctl monitors -j`
toml = "0.9" # pins.toml state file
jxl-oxide = "0.12.6"
usvg = { version = "0.48.1", default-features = false } # svg natural size (same tree as the fork's resvg)
zenavif = "0.1.6"
zenpixels = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "mdrv-gpui-platform", git = "https://github.com/mdrv/gpui-ce", tag = "mdrv-gpui-0.0.260925.10", features = [
	"wayland",
] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "mdrv-gpui-platform", git = "https://github.com/mdrv/gpui-ce", tag = "mdrv-gpui-0.0.260925.10", features = [
	"font-kit",
] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
	"NSApplication",
	"NSPasteboard",
	"NSEvent",
	"NSScreen",
	"NSRunningApplication",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_Storage_FileSystem",
	"Win32_System_Pipes",
	"Win32_System_Threading",
	"Win32_UI_HiDpi",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_WindowsAndMessaging",
] } # GetCursorPos ground truth; W2 adds pipes/hotkey

[patch.crates-io]
arrayref = { git = "https://github.com/mdrv/gpui-ce" } # yanked/broken on crates.io (via tiny-skia)
